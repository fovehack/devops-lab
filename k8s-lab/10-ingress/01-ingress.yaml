# INGRESS - Enruta tráfico HTTP/HTTPS externo a servicios internos
# Necesita un Ingress Controller instalado (usamos Nginx de Minikube)
#
# SETUP PREVIO (ejecutar una vez):
# minikube addons enable ingress
# minikube addons enable ingress-dns
# kubectl wait --namespace ingress-nginx \
#   --for=condition=ready pod \
#   --selector=app.kubernetes.io/component=controller \
#   --timeout=90s

# App 1 - Servicio de "productos"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-productos
  labels:
    modulo: "10-ingress"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productos
  template:
    metadata:
      labels:
        app: productos
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "<h1>Servicio PRODUCTOS</h1>" > /usr/share/nginx/html/index.html
          nginx -g 'daemon off;'
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: svc-productos
  labels:
    modulo: "10-ingress"
spec:
  selector:
    app: productos
  ports:
  - port: 80
    targetPort: 80
---
# App 2 - Servicio de "usuarios"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-usuarios
  labels:
    modulo: "10-ingress"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usuarios
  template:
    metadata:
      labels:
        app: usuarios
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "<h1>Servicio USUARIOS</h1>" > /usr/share/nginx/html/index.html
          nginx -g 'daemon off;'
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: svc-usuarios
  labels:
    modulo: "10-ingress"
spec:
  selector:
    app: usuarios
  ports:
  - port: 80
    targetPort: 80
---
# INGRESS RULE - Enruta según el path
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-demo
  labels:
    modulo: "10-ingress"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: devops-lab.local      # Dominio local (añadir a /etc/hosts)
    http:
      paths:
      - path: /productos
        pathType: Prefix
        backend:
          service:
            name: svc-productos
            port:
              number: 80
      - path: /usuarios
        pathType: Prefix
        backend:
          service:
            name: svc-usuarios
            port:
              number: 80

# Comandos:
# 1. Habilitar ingress en minikube:
#    minikube addons enable ingress
#
# 2. Aplicar manifiestos:
#    kubectl apply -f 01-ingress.yaml
#
# 3. Obtener IP de minikube:
#    minikube ip   → ej: 192.168.49.2
#
# 4. Añadir a /etc/hosts:
#    echo "192.168.49.2 devops-lab.local" | sudo tee -a /etc/hosts
#
# 5. Probar:
#    curl http://devops-lab.local/productos
#    curl http://devops-lab.local/usuarios
#
# 6. Ver reglas del ingress:
#    kubectl get ingress
#    kubectl describe ingress ingress-demo
