# Los Secrets almacenan datos sensibles en base64
# IMPORTANTE: base64 NO es cifrado, es solo encoding
# Para producción real usar Vault, Sealed Secrets, o External Secrets

# Crear secret desde comando (recomendado, evita tener valores en yaml):
# kubectl create secret generic app-secret \
#   --from-literal=db-password=miPasswordSeguro \
#   --from-literal=api-key=miApiKey123

# O desde archivo:
# kubectl create secret generic app-secret --from-file=./credentials.txt

# Los valores en yaml deben estar en base64:
# echo -n "miPasswordSeguro" | base64  → bWlQYXNzd29yZFNlZ3Vybw==

apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  labels:
    modulo: "06-secrets"
type: Opaque
data:
  # base64 de "miPasswordSeguro"
  db-password: bWlQYXNzd29yZFNlZ3Vybw==
  # base64 de "miApiKey123"
  api-key: bWlBcGlLZXkxMjM=
  # base64 de "admin"
  db-user: YWRtaW4=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-con-secrets
  labels:
    modulo: "06-secrets"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      volumes:
      - name: secret-vol
        secret:
          secretName: app-secret

      containers:
      - name: app
        image: nginx:alpine

        # Método 1: Secret como variable de entorno individual
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: db-password
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: api-key

        # Método 2: Todas las claves como env vars
        envFrom:
        - secretRef:
            name: app-secret

        # Método 3: Montado como archivo (más seguro, no aparece en env)
        volumeMounts:
        - name: secret-vol
          mountPath: /etc/secrets
          readOnly: true

# Comandos:
# kubectl apply -f 01-secrets.yaml
# kubectl get secrets
# kubectl describe secret app-secret   (no muestra valores)
#
# Ver valor decodificado:
# kubectl get secret app-secret -o jsonpath='{.data.db-password}' | base64 -d
#
# Ver archivos montados:
# kubectl exec -it <pod> -- ls /etc/secrets
# kubectl exec -it <pod> -- cat /etc/secrets/db-password
