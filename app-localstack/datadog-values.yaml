    enabled: true
  orchestratorExplorer:
    enabled: true
  # ---- ACTIVAMOS LOS LOGS PARA NUESTRA APP ----
  logs:
    enabled: true
    containerCollectAll: true
providers:
  gke:
    gch:
      enabled: false