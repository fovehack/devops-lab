apiVersion: v1
kind: Service
metadata:
  name: svc-nodeport
  labels:
    modulo: "04-services"
spec:
  type: NodePort
  selector:
    app: services-demo
  ports:
  - port: 80                  # Puerto interno del clúster
    targetPort: 80            # Puerto del contenedor
    nodePort: 30080           # Puerto expuesto en el nodo (30000-32767)
    protocol: TCP

# NodePort expone el servicio en un puerto del NODO
# Accesible desde fuera del clúster via IP_DEL_NODO:nodePort
#
# Comandos:
# kubectl apply -f 02-nodeport.yaml
# kubectl get svc svc-nodeport
#
# Obtener la URL de acceso:
# minikube service svc-nodeport --url
#
# O directamente abrir en el navegador:
# minikube service svc-nodeport
